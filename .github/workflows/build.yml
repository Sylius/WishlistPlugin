name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "adr/**"
            - "*.md"
    pull_request:
        paths-ignore:
            - "adr/**"
            - "*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * *" # Run at 1am every day
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database == 'mysql' && format('MySQL {0}', matrix.database_version) || format('PostgreSQL {0}', matrix.database_version) }}, legacy_pdf_generation: ${{ matrix.legacy_pdf_generation }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3"]
                symfony: ["^6.4", "^7.4"]
                sylius: ["~2.1.0", "~2.2.0"]
                node: ["22.x"]
                database: ["mysql"]
                database_version: ["8.4"]
                legacy_pdf_generation: [true, false]

                include:
                    -
                        php: "8.3"
                        symfony: "^6.4"
                        sylius: "~2.1.0"
                        node: "22.x"
                        database: "postgres"
                        database_version: "17.5"
                        legacy_pdf_generation: true

                    -
                        php: "8.3"
                        symfony: "^7.4"
                        sylius: "~2.2.0"
                        node: "22.x"
                        database: "postgres"
                        database_version: "17.5"
                        legacy_pdf_generation: false

                    -
                        # doctrine/doctrine-bundle only supports symfony/cache ^8.0 starting with 3.2,
                        # which requires PHP ^8.4 — PHP 8.3 cannot resolve this combination.
                        php: "8.4"
                        symfony: "^8.0"
                        sylius: "~2.3.0@alpha"
                        node: "22.x"
                        database: "mysql"
                        database_version: "8.4"
                        legacy_pdf_generation: false

        env:
            APP_ENV: test
            DATABASE_URL: ${{ matrix.database == 'mysql' && format('mysql://root:root@127.0.0.1/sylius?serverVersion={0}', matrix.database_version) || format('pgsql://postgres:postgres@127.0.0.1/sylius?serverVersion={0}', matrix.database_version) }}
            TEST_SYLIUS_WISHLIST_PDF_LEGACY: "${{ matrix.legacy_pdf_generation }}"

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Require Sylius TestApplication dev branch (temporary — remove once Sylius/TestApplication#48 is merged)
                if: matrix.sylius == '~2.3.0@alpha'
                run: composer require --dev sylius/test-application:dev-sylius-2.3-symfony-8 --no-update

            -
                # lchrusciel/api-test-case only gained Symfony 8 support in v6. Kept scoped to this row
                # (rather than widened globally in composer.json) so composer's solver can't pick v6 for the
                # 2.1/2.2 rows too, where it isn't needed and would needlessly shift other resolved versions.
                name: Require api-test-case v6 for Symfony 8 support
                if: matrix.sylius == '~2.3.0@alpha'
                run: composer require --dev lchrusciel/api-test-case:^6.0 --no-update

            -
                # phpstan/phpstan 1.12.x fails to analyse this codebase under Symfony 8 (symfony/var-exporter's
                # LazyGhost check), so PHPStan 2.x is needed here. Kept scoped to this row (rather than widened
                # globally in composer.json) because PHPStan 2.x's stricter symfony/config stubs flag a false
                # positive (`NodeDefinition::children()`) in Configuration.php on the 2.1/2.2 rows.
                name: Require PHPStan 2.x for Symfony 8 support
                if: matrix.sylius == '~2.3.0@alpha'
                run: composer require --dev "phpstan/phpstan-doctrine:^2.0" "phpstan/phpstan-webmozart-assert:^2.0" "sylius/sylius-rector:^3.0" --no-update

            -
                # The behat/behat ecosystem has no Symfony 8-compatible release yet (behat/behat only
                # has an alpha, and friends-of-behat/suite-settings-extension + dmore/behat-chrome-extension
                # have none at all), so it's dropped from this row's dependency graph until it catches up.
                name: Drop the Behat test suite (no Symfony 8 support upstream yet)
                if: matrix.sylius == '~2.3.0@alpha'
                run: |
                    composer remove --dev --no-update \
                        behat/behat \
                        dmore/behat-chrome-extension \
                        friends-of-behat/mink \
                        friends-of-behat/mink-browserkit-driver \
                        friends-of-behat/mink-debug-extension \
                        friends-of-behat/mink-extension \
                        friends-of-behat/page-object-extension \
                        friends-of-behat/suite-settings-extension \
                        friends-of-behat/symfony-extension \
                        friends-of-behat/variadic-extension \
                        robertfausk/behat-panther-extension \
                        sylius-labs/suite-tags-extension

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v3.2.0
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    database_version: "${{ matrix.database_version }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Run security check
                run: composer audit --abandoned=ignore

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Run ECS
                run: vendor/bin/ecs

            -
                name: Lint container
                run: vendor/bin/console lint:container

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse -c phpstan.neon src/

            -
                name: Run PHPUnit
                run: vendor/bin/phpunit --colors=always

            -
                name: Run Behat
                if: matrix.sylius != '~2.3.0@alpha'
                run: vendor/bin/behat --colors --strict -vvv -f progress --no-interaction || vendor/bin/behat --colors --strict -vvv -f progress --no-interaction --rerun

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }} ${{ matrix.database_version }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true

            -
                name: Upload test log logs
                uses: actions/upload-artifact@v4
                if: failure()
                with:
                    name: "Var logs - Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }} ${{ matrix.database_version }}"
                    path: tests/Application/var/log/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true
